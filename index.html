<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>นาฬิกาจับเวลาเฉพาะกิจ</title>
    <style>
        :root {
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text: #1C1C1E;
            --text-sub: #8E8E93;
            --border: #C7C7CC;
            --input-bg: #FAFAFA;
            --primary: #007AFF;
            --yellow-warm: #FFCC00;
            --danger: #FF3B30;
            --danger-bg: #FFE5E5;
            --success: #34C759;
            --circle-btn-bg: #E5E5EA;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        [data-theme="dark"] {
            --bg: #000000;
            --card-bg: #1C1C1E;
            --text: #FFFFFF;
            --text-sub: #8E8E93;
            --border: #38383A;
            --input-bg: #2C2C2E;
            --primary: #0A84FF;
            --yellow-warm: #FFD60A;
            --danger: #FF453A;
            --danger-bg: #3A100E;
            --success: #30D158;
            --circle-btn-bg: #2C2C2E;
            --shadow: rgba(255, 255, 255, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle-container {
            margin-bottom: 16px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .btn-theme-toggle {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 16px var(--shadow);
            position: relative;
            box-sizing: border-box;
            transition: background-color 0.3s;
        }

        .btn-close-circle {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--circle-btn-bg);
            border: none;
            color: var(--text-sub);
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 20px 0;
            text-align: center;
        }

        .timer-display {
            font-size: 56px;
            font-weight: bold;
            font-family: -apple-system-font, "SF Pro Display", monospace;
            color: var(--primary);
            margin: 10px 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .sub-text {
            font-size: 16px;
            color: var(--text-sub);
            text-align: center;
            margin-bottom: 10px;
        }

        .input-group {
            width: 100%;
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
        }

        .input-with-select {
            display: flex;
            gap: 8px;
        }

        input, select {
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text);
        }

        input { flex: 1; width: 100%; }
        select { width: 110px; cursor: pointer; }

        .warning-banner {
            display: none;
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 16px;
            text-align: center;
            font-weight: 500;
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }

        button.btn-action {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        button.btn-action:active { opacity: 0.8; }

        .btn-start { background-color: var(--success); color: white; }
        .btn-pause { background-color: var(--yellow-warm); color: #1C1C1E; }
        .btn-stop { background-color: var(--danger); color: white; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .modal-title {
            font-size: 22px;
            font-weight: bold;
            color: var(--text);
            margin-bottom: 8px;
        }

        .modal-body {
            font-size: 15px;
            color: var(--text-sub);
            margin-bottom: 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
            border-radius: 3px;
            overflow: hidden;
            position: absolute;
            bottom: 0; left: 0;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--primary);
            width: 100%;
            transition: width 0.1s linear;
        }
    </style>
</head>
<body>

    <div class="theme-toggle-container">
        <button class="btn-theme-toggle" onclick="toggleTheme()" id="btn-theme">
            <span id="theme-icon">☀️</span>
            <span id="theme-text" style="font-size: 14px;">White Mode</span>
        </button>
    </div>

    <div class="card">
        <!-- Setup View -->
        <div id="setup-view">
            <h1>นาฬิกาจับเวลาเฉพาะกิจ</h1>

            <div class="warning-banner" id="warning-banner">
                การตั้งเวลาที่น้อยกว่า 10 วินาทีลงไปจะเป็นการสร้างความรำคาญและมลพิษทางเสียงโดยรอบที่ไม่จำเป็น
            </div>

            <div class="input-group">
                <label for="input-time">เวลารวม:</label>
                <div class="input-with-select">
                    <input type="number" id="input-time" min="1" placeholder="ระบุเวลา">
                    <select id="select-unit">
                        <option value="sec">วินาที</option>
                        <option value="min" selected>นาที</option>
                        <option value="hr">ชั่วโมง</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label for="input-interval">เตือนย่อยทุกๆ:</label>
                <div class="input-with-select">
                    <input type="number" id="input-interval" min="1" placeholder="ระบุเวลา">
                    <select id="select-interval-unit">
                        <option value="sec" selected>วินาที</option>
                        <option value="min">นาที</option>
                        <option value="hr">ชั่วโมง</option>
                    </select>
                </div>
            </div>

            <button class="btn-action btn-start" onclick="startTimer()">เริ่มจับเวลา</button>
        </div>

        <!-- Timer Running View -->
        <div id="timer-view" style="display: none;">
            <button class="btn-close-circle" onclick="stopTimer()" aria-label="ปิด">✕</button>
            <div class="sub-text" id="round-text">รอบที่ 0</div>
            <div class="timer-display" id="time-display">00:00:00</div>
            
            <div class="button-stack">
                <button id="btn-pause-resume" class="btn-action btn-pause" onclick="togglePause()">พักเวลา</button>
                <button class="btn-action btn-stop" onclick="stopTimer()">ยกเลิก / ตั้งค่าใหม่</button>
            </div>
        </div>
    </div>

    <!-- Finish Modal Popup -->
    <div class="modal-overlay" id="finish-modal">
        <div class="modal-content">
            <div style="font-size: 40px; margin-bottom: 8px;">🎉</div>
            <div class="modal-title">เวลาหมดแล้ว!</div>
            <div class="modal-body">เก่งมากครับ ทำกิจกรรมเสร็จสิ้นแล้ว</div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="popup-progress"></div>
            </div>
        </div>
    </div>

    <script>
        let timerInterval = null;
        let totalSeconds = 0;
        let currentSeconds = 0;
        let intervalLimit = 0;
        let roundCount = 0;
        let isPaused = false;
        let wakeLock = null;

        let audioCtx = null;
        let thaiVoice = null;
        let currentTheme = 'light';

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedSettings();
            initVoice();
            attachRealtimeListeners();
        });

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
            localStorage.setItem('timer_theme', currentTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (theme === 'dark') {
                icon.innerText = '🌙';
                text.innerText = 'Dark Mode';
            } else {
                icon.innerText = '☀️';
                text.innerText = 'White Mode';
            }
        }

        function calculateTotalSeconds() {
            const timeVal = parseFloat(document.getElementById('input-time').value) || 0;
            const unit = document.getElementById('select-unit').value;
            if (unit === 'sec') return timeVal;
            if (unit === 'min') return timeVal * 60;
            if (unit === 'hr') return timeVal * 3600;
            return 0;
        }

        function calculateIntervalSeconds() {
            const intervalVal = parseFloat(document.getElementById('input-interval').value) || 0;
            const unit = document.getElementById('select-interval-unit').value;
            if (unit === 'sec') return intervalVal;
            if (unit === 'min') return intervalVal * 60;
            if (unit === 'hr') return intervalVal * 3600;
            return 0;
        }

        function validateMinimum() {
            const timeVal = document.getElementById('input-time').value.trim();
            const secs = calculateTotalSeconds();
            const banner = document.getElementById('warning-banner');

            if (timeVal !== '' && secs > 0 && secs < 10) {
                banner.style.display = 'block';
                return false;
            } else {
                banner.style.display = 'none';
                return true;
            }
        }

        // AUDIT FIX: ผูก Event Listener ให้ครอบคลุมทุก Input/Select ทั้งสองช่อง
        function attachRealtimeListeners() {
            const inputs = [
                document.getElementById('input-time'),
                document.getElementById('select-unit'),
                document.getElementById('input-interval'),
                document.getElementById('select-interval-unit')
            ];

            inputs.forEach(el => {
                if (el) {
                    el.addEventListener('input', validateMinimum);
                    el.addEventListener('change', validateMinimum);
                }
            });
        }

        function initVoice() {
            const updateVoices = () => {
                const voices = window.speechSynthesis.getVoices();
                thaiVoice = voices.find(v => v.lang === 'th-TH' || v.lang === 'th') ||
                            voices.find(v => v.name.includes('Kanya') || v.name.includes('Pattara') || v.name.includes('Thai')) ||
                            voices.find(v => v.lang.toLowerCase().includes('th'));
            };
            updateVoices();
            if (typeof speechSynthesis !== 'undefined' && speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = updateVoices;
            }
        }

        function unlockIOSAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);

            window.speechSynthesis.cancel();
            const silentUtterance = new SpeechSynthesisUtterance("");
            silentUtterance.volume = 0;
            window.speechSynthesis.speak(silentUtterance);
        }

        function playBeep() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.5);
        }

        function playCheerSound() {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const notes = [523.25, 659.25, 783.99, 1046.50];
            const now = audioCtx.currentTime;

            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + (index * 0.12));

                gain.gain.setValueAtTime(0, now + (index * 0.12));
                gain.gain.linearRampToValueAtTime(0.8, now + (index * 0.12) + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (index * 0.12) + 0.4);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now + (index * 0.12));
                osc.stop(now + (index * 0.12) + 0.4);
            });
        }

        function speakThai(text) {
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            if (thaiVoice) utterance.voice = thaiVoice;
            
            utterance.lang = 'th-TH';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        function saveSettings(timeVal, unitVal, intervalVal, intervalUnitVal) {
            localStorage.setItem('timer_value', timeVal);
            localStorage.setItem('timer_unit', unitVal);
            localStorage.setItem('timer_interval', intervalVal);
            localStorage.setItem('timer_interval_unit', intervalUnitVal);
        }

        function loadSavedSettings() {
            const savedTheme = localStorage.getItem('timer_theme') || 'light';
            currentTheme = savedTheme;
            applyTheme(currentTheme);

            const savedTime = localStorage.getItem('timer_value');
            const savedUnit = localStorage.getItem('timer_unit');
            const savedInterval = localStorage.getItem('timer_interval');
            const savedIntervalUnit = localStorage.getItem('timer_interval_unit');

            if (savedTime && savedUnit && savedInterval) {
                document.getElementById('input-time').value = savedTime;
                document.getElementById('select-unit').value = savedUnit;
                document.getElementById('input-interval').value = savedInterval;
                if (savedIntervalUnit) {
                    document.getElementById('select-interval-unit').value = savedIntervalUnit;
                }
            }
            validateMinimum();
        }

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log('Wake Lock Error:', err); }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => wakeLock = null);
            }
        }

        function updateDisplay() {
            const h = Math.floor(currentSeconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((currentSeconds % 3600) / 60).toString().padStart(2, '0');
            const s = (currentSeconds % 60).toString().padStart(2, '0');
            
            document.getElementById('time-display').innerText = `${h}:${m}:${s}`;
            document.getElementById('round-text').innerText = `รอบที่ ${roundCount}`;
        }

        function showFinishModal(durationMs = 4000) {
            const modal = document.getElementById('finish-modal');
            const progress = document.getElementById('popup-progress');
            
            progress.style.transition = 'none';
            progress.style.width = '100%';
            modal.style.display = 'flex';

            setTimeout(() => {
                progress.style.transition = `width ${durationMs}ms linear`;
                progress.style.width = '0%';
            }, 50);

            setTimeout(() => {
                modal.style.display = 'none';
            }, durationMs + 100);
        }

        function startTimer() {
            const timeVal = document.getElementById('input-time').value;
            const unitVal = document.getElementById('select-unit').value;
            const intervalVal = document.getElementById('input-interval').value;
            const intervalUnitVal = document.getElementById('select-interval-unit').value;

            totalSeconds = calculateTotalSeconds();
            intervalLimit = calculateIntervalSeconds();

            if (totalSeconds < 10) {
                document.getElementById('warning-banner').style.display = 'block';
                alert("การตั้งเวลาต้องไม่น้อยกว่า 10 วินาทีครับ");
                return;
            }

            if (isNaN(intervalLimit) || intervalLimit <= 0) {
                alert("กรุณาระบุช่วงเวลาเตือนย่อยให้ถูกต้อง");
                return;
            }

            // AUDIT FIX: ตรวจสอบความถูกต้องทางตรรกะว่าช่วงเตือนย่อยต้องไม่ยาวกว่าเวลารวม
            if (intervalLimit >= totalSeconds) {
                alert("ช่วงเวลาเตือนย่อยต้องน้อยกว่าเวลารวมครับ");
                return;
            }

            unlockIOSAudio();
            saveSettings(timeVal, unitVal, intervalVal, intervalUnitVal);

            currentSeconds = totalSeconds;
            roundCount = 0;
            isPaused = false;

            document.getElementById('btn-pause-resume').innerText = "พักเวลา";
            document.getElementById('setup-view').style.display = 'none';
            document.getElementById('timer-view').style.display = 'block';
            
            updateDisplay();
            requestWakeLock();
            playBeep();

            runTimerLoop();
        }

        function runTimerLoop() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isPaused) return;

                currentSeconds--;
                updateDisplay();

                if (currentSeconds <= 0) {
                    stopTimer();
                    playCheerSound();
                    showFinishModal(4000);
                    setTimeout(() => {
                        speakThai("หมดเวลาแล้วครับ เก่งมากครับ!");
                    }, 600);
                    return;
                }

                const elapsed = totalSeconds - currentSeconds;
                if (elapsed > 0 && elapsed % intervalLimit === 0) {
                    roundCount++;
                    updateDisplay();
                    playBeep();
                    setTimeout(() => {
                        const unitSelect = document.getElementById('select-interval-unit');
                        const unitText = unitSelect.options[unitSelect.selectedIndex].text;
                        const rawIntervalVal = document.getElementById('input-interval').value;
                        speakThai(`${rawIntervalVal} ${unitText} ครั้งที่ ${roundCount}`);
                    }, 600);
                }

            }, 1000);
        }

        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('btn-pause-resume');
            if (isPaused) {
                btn.innerText = "เล่นต่อ (Resume)";
                window.speechSynthesis.cancel();
            } else {
                btn.innerText = "พักเวลา";
                unlockIOSAudio();
                playBeep();
            }
        }

        function stopTimer() {
            clearInterval(timerInterval);
            releaseWakeLock();
            isPaused = false;
            document.getElementById('setup-view').style.display = 'block';
            document.getElementById('timer-view').style.display = 'none';
            window.speechSynthesis.cancel();
        }
    </script>
</body>
</html>
